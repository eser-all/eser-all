        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box
            }

            html,body {
                min-height: 100%;
                font-family: 'Segoe UI',Arial,sans-serif
            }

            body {
                margin: 0;
                padding: 0;
                background: #121212;
                color: #f0f0f0;
                transition: background .3s,color .3s;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                position: relative
            }

            body.light-mode {
                background: linear-gradient(-45deg,#ee7752,#e73c7e,#23a6d5,#23d5ab);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                color: #fff
            }

            @keyframes gradientBG {
                0% {
                    background-position: 0 50%
                }

                50% {
                    background-position: 100% 50%
                }

                100% {
                    background-position: 0 50%
                }
            }

            #particles-js {
                position: fixed;
                width: 100%;
                height: 100%;
                z-index: 0
            }

            .theme-toggle {
                position: fixed;
                left: 20px;
                bottom: 20px;
                width: 42px;
                height: 42px;
                border-radius: 50%;
                border: 2px solid #fff;
                background: rgba(255,255,255,.1);
                color: #fff;
                font-size: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 1000
            }

            .dashboard {
                position: relative;
                z-index: 1;
                padding: 15px;
                text-align: center;
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .main-header {
                font-size: 24px;
                font-weight: 800;
                margin-bottom: 10px;
                margin-top: 5px;
                letter-spacing: .5px
            }

            /* Sheet Container for Large Data */
            .sheet-container {
                width: 98%;
                max-width: 1450px;
                height: 80vh;
                background: rgba(255,255,255,.05);
                border: 1px solid rgba(255,255,255,.2);
                border-radius: 12px;
                overflow: hidden;
                backdrop-filter: blur(6px);
                box-shadow: 0 8px 20px rgba(0,0,0,.5);
            }

            .sheet-container iframe {
                width: 100%;
                height: 100%;
                border: none;
            }

            .user-login-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,.85);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 999
            }

            .modal-content {
                background: #1e1e1e;
                color: #fff;
                padding: 20px;
                border-radius: 10px;
                width: 320px;
                border: 1px solid #333;
                text-align: center;
                position: relative
            }

            .modal-content input {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #444;
                background: #2a2a2a;
                color: #fff;
                border-radius: 4px;
                outline: 0;
                font-family: inherit
            }

            .modal-content button {
                padding: 8px 12px;
                margin-top: 5px;
                cursor: pointer;
                border: none;
                border-radius: 4px;
                font-weight: 700;
                background: #4CAF50;
                color: #fff;
                width: 100%
            }

            .divider {
                display: flex;
                align-items: center;
                text-align: center;
                margin: 15px 0;
                color: #888;
                font-size: 12px
            }

            .divider::after,.divider::before {
                content: '';
                flex: 1;
                border-bottom: 1px solid #444
            }

            .divider:not(:empty)::before {
                margin-right: .5em
            }

            .divider:not(:empty)::after {
                margin-left: .5em
            }

            .google-btn {
                background: #fff!important;
                color: #333!important;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                border: 1px solid #ccc!important
            }

            .logout-btn {
                position: fixed;
                right: 20px;
                bottom: 20px;
                padding: 10px 18px;
                border-radius: 20px;
                border: none;
                background: #e11d48;
                color: #fff;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                z-index: 1000;
                box-shadow: 0 4px 10px rgba(225,29,72,.3)
            }

            .developer-footer {
                position: relative;
                z-index: 1;
                text-align: center;
                padding: 10px;
                font-size: 13px;
                background: rgba(0,0,0,.4);
                backdrop-filter: blur(4px);
            }

            .developer-footer span {
                font-weight: 700;
                color: #00e676
            }
        </style>
    </head>
