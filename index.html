<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FTP & Live TV Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }
    
    body {
      margin: 0; padding: 0;
      background: #0f172a;
      color: #f8fafc;
      transition: background 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    body.light-mode {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .dashboard {
      position: relative;
      z-index: 1;
      padding: 30px 15px 10px;
      text-align: center;
    }

    .section-title {
      font-size: 22px;
      margin: 25px 0 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #38bdf8;
    }

    .link-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      position: relative;
      width: 160px;
      height: 110px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .link-card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 20px rgba(56, 189, 248, 0.2);
    }

    .link-card i {
      font-size: 32px;
      margin-bottom: 8px;
      pointer-events: none;
    }

    .link-card i.fa-play-circle { color: #4CAF50; }
    .link-card i.fa-folder-open { color: #FFC107; }
    .link-card i.fa-film { color: #E91E63; }
    .link-card i.fa-photo-video { color: #9C27B0; }
    .link-card i.fa-tv { color: #FF9800; }
    .link-card i.fa-desktop { color: #00BCD4; }
    .link-card i.fa-landmark { color: #00E676; }
    .link-card i.fa-graduation-cap { color: #FF5722; }
    .link-card i.fa-envelope { color: #EA4335; }
    .link-card i.fa-paper-plane { color: #38BDF8; }

    .link-card .card-title {
      width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      line-height: 1.3;
    }

    .login-modal, .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: #1e293b;
      color: #fff;
      padding: 28px;
      border-radius: 16px;
      width: 320px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      border-radius: 8px;
      outline: none;
    }

    .modal-content button {
      padding: 12px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      background: #0284c7;
      color: white;
      width: 100%;
    }

    .theme-toggle {
      position: fixed;
      right: 20px; top: 20px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .logout-btn {
      position: fixed;
      left: 20px; bottom: 20px;
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: #e11d48;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3);
    }

    .developer-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 15px 10px;
      font-size: 14px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      margin-top: 30px;
    }
    .developer-footer span { font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <!-- Theme Toggle -->
  <div class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i>
  </div>

  <!-- Firebase User Login Modal -->
  <div class="login-modal" id="loginModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;"><i class="fas fa-shield-alt" style="color: #38bdf8;"></i> Portal Login</h3>
      <input type="email" id="userEmail" placeholder="Email Address">
      <input type="password" id="userPass" placeholder="Password">
      <button onclick="loginUser()">Login</button>
      <div id="loginError" style="color: #f44336; font-size: 12px; margin-top: 10px; display: none;"></div>
    </div>
  </div>

  <!-- Email Modal -->
  <div class="modal" id="emailModal" style="display: none;">
    <div class="modal-content" style="width: 360px; text-align: left;">
      <h3 style="margin-bottom: 15px; text-align: center;"><i class="fas fa-envelope" style="color: #38bdf8;"></i> Send Mail</h3>
      
      <label style="font-size: 12px; color: #94a3b8;">To Email:</label>
      <input type="email" id="emailTo" placeholder="recipient@example.com">
      
      <label style="font-size: 12px; color: #94a3b8;">Subject:</label>
      <input type="text" id="emailSubject" placeholder="Mail Subject">
      
      <label style="font-size: 12px; color: #94a3b8;">Message:</label>
      <textarea id="emailBody" rows="4" style="width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; outline: none; margin-bottom: 12px; resize: none;"></textarea>
      
      <div style="display: flex; gap: 10px;">
        <button onclick="sendMailDirectly()" style="background: #0284c7;">Compose</button>
        <button onclick="closeEmailModal()" style="background: #64748b;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Main Portal Dashboard -->
  <div class="dashboard" id="mainDashboard" style="display: none;">
    <h1 style="margin-bottom: 20px; font-weight: 800;">ESER-ALL Portal</h1>

    <div class="section-title"><i class="fas fa-play-circle"></i> FTP Server 1</div>
    <div class="link-grid" id="ftp-section"></div>

    <div class="section-title"><i class="fas fa-folder-open"></i> FTP Server 2</div>
    <div class="link-grid" id="ftp2-section"></div>

    <div class="section-title"><i class="fas fa-film"></i> FTP Server 3</div>
    <div class="link-grid" id="ftp3-section"></div>

    <div class="section-title"><i class="fas fa-photo-video"></i> FTP Server 4</div>
    <div class="link-grid" id="ftp4-section"></div>
    
    <div class="section-title"><i class="fas fa-tv"></i> Live TV 1</div>
    <div class="link-grid" id="tv-section"></div>

    <div class="section-title"><i class="fas fa-desktop"></i> Live TV 2</div>
    <div class="link-grid" id="tv2-section"></div>

    <!-- Mail Actions Section -->
    <div class="section-title"><i class="fas fa-envelope"></i> Email Options</div>
    <div class="link-grid" id="mail-section"></div>

    <div class="section-title"><i class="fas fa-landmark"></i> Government Services</div>
    <div class="link-grid" id="gov-section"></div>

    <div class="section-title"><i class="fas fa-graduation-cap"></i> University Admissions</div>
    <div class="link-grid" id="edu-section"></div>
  </div>

  <button class="logout-btn" id="btnLogout" style="display: none;" onclick="logoutUser()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

  <footer class="developer-footer">
    Developed by <span>Antu</span>
  </footer>

  <!-- Firebase & Particles SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDB4r_a5gPtKhlzM0qqmYHBb6HA_I2SmHQ",
      authDomain: "eser-all.firebaseapp.com",
      databaseURL: "http://eser-all-default-rtdb.firebaseio.com",
      projectId: "eser-all",
      storageBucket: "eser-all.appspot.com",
      messagingSenderId: "741870576674",
      appId: "1:741870576674:web:2a5094bd05f44f0b98d67b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const FTP_API_HOST = '10.10.10.10';
    const FTP2_API_HOST = '172.16.50.4'; 
    const FTP3_API_HOST = '172.19.178.179';
    const FTP4_API_HOST = '10.16.100.244';
    const TV_API_HOST = '172.28.28.54';
    const TV2_API_HOST = '172.19.178.180';

    let ftpLinks = [{ title: "FTP Server 1", url: http://${FTP_API_HOST}/ }];
    let ftp2Links = [{ title: "FTP Server 2", url: http://${FTP2_API_HOST}/ }];
    let ftp3Links = [{ title: "FTP Server 3", url: http://${FTP3_API_HOST}/ }];
    let ftp4Links = [{ title: "FTP Server 4", url: http://${FTP4_API_HOST}/dashboard.php }];
    let tvLinks = [{ title: "Live TV 1", url: http://${TV_API_HOST}/ }];
    let tv2Links = [{ title: "Live TV 2", url: http://${TV2_API_HOST}/ }];

    let govLinks = [
      { title: "NID / ভোটার আবেদন", url: "http://services.nidw.gov.bd" },
      { title: "জন্ম নিবন্ধন ও সংশোধন", url: "http://bdris.gov.bd" },
      { title: "পাসপোর্টের আবেদন", url: "http://epassport.gov.bd" },
      { title: "পুলিশ ক্লিয়ারেন্স", url: "http://pcc.police.gov.bd" },
      { title: "e-TIN সার্টিফিকেট", url: "http://incometax.gov.bd" }
    ];

    let eduLinks = [
      { title: "জিএসটি বিশ্ববিদ্যালয়", url: "http://gstadmission.ac.bd" },
      { title: "ঢাকা বিশ্ববিদ্যালয়", url: "http://duadmission.eis.du.ac.bd" }
    ];

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        document.getElementById('btnLogout').style.display = 'block';
        renderLinks();
      } else {
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
      }
    });

    function loginUser() {
      const email = document.getElementById('userEmail').value.trim();
      const pass = document.getElementById('userPass').value.trim();
      const err = document.getElementById('loginError');

      if(!email || !pass) {
        err.innerText = "Email & Password required!";
        err.style.display = "block";
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => { err.style.display = "none"; })
        .catch((error) => {
          err.innerText = "Invalid credentials!";
          err.style.display = "block";
        });
    }

    function logoutUser() {
      auth.signOut();
    }

    function openEmailModal() {
      document.getElementById('emailModal').style.display = 'flex';
    }

    function closeEmailModal() {
      document.getElementById('emailModal').style.display = 'none';
    }

    function sendMailDirectly() {
      const to = document.getElementById('emailTo').value.trim();
      const subject = encodeURIComponent(document.getElementById('emailSubject').value.trim());
      const body = encodeURIComponent(document.getElementById('emailBody').value.trim());

      if (!to) {
        alert("Please enter recipient email!");
        return;
      }

      const gmailUrl = https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body};
      window.open(gmailUrl, '_blank');
      closeEmailModal();
    }

    function renderLinks() {
      const ftpc = document.getElementById('ftp-section');
      const ftp2c = document.getElementById('ftp2-section');
      const ftp3c = document.getElementById('ftp3-section');
      const ftp4c = document.getElementById('ftp4-section');
      const tvc = document.getElementById('tv-section');
      const tv2c = document.getElementById('tv2-section');
      const mailc = document.getElementById('mail-section');
      const govc = document.getElementById('gov-section');
      const educ = document.getElementById('edu-section');
      
      ftpc.innerHTML = ''; ftp2c.innerHTML = ''; ftp3c.innerHTML = ''; ftp4c.innerHTML = '';
      tvc.innerHTML = ''; tv2c.innerHTML = ''; mailc.innerHTML = ''; govc.innerHTML = ''; educ.innerHTML = '';
      
      ftpLinks.forEach(l => { ftpc.innerHTML += genCard(l.title, l.url, 'ftp'); });
      ftp2Links.forEach(l => { ftp2c.innerHTML += genCard(l.title, l.url, 'ftp2'); });
      ftp3Links.forEach(l => { ftp3c.innerHTML += genCard(l.title, l.url, 'ftp3'); });
      ftp4Links.forEach(l => { ftp4c.innerHTML += genCard(l.title, l.url, 'ftp4'); });
      tvLinks.forEach(l => { tvc.innerHTML += genCard(l.title, l.url, 'tv'); });
      tv2Links.forEach(l => { tv2c.innerHTML += genCard(l.title, l.url, 'tv2'); });
      
      // Email Cards
      mailc.innerHTML += `
        <div class="link-card" onclick="window.open('https://mail.google.com/mail/?view=cm&fs=1', '_blank')">
          <i class="fas fa-envelope"></i>
          <div class="card-title">Gmail Inbox / Compose</div>
        </div>
        <div class="link-card" onclick="openEmailModal()">
          <i class="fas fa-paper-plane"></i>
          <div class="card-title">Send Direct Email</div>
        </div>
      `;

      govLinks.forEach(l => { govc.innerHTML += genCard(l.title, l.url, 'gov'); });
      eduLinks.forEach(l => { educ.innerHTML += genCard(l.title, l.url, 'edu'); });
    }

    function genCard(title, url, type) {
      let iconClass = 'fas fa-play-circle';
      if (type === 'ftp2') iconClass = 'fas fa-folder-open';
      if (type === 'ftp3') iconClass = 'fas fa-film';
      if (type === 'ftp4') iconClass = 'fas fa-photo-video';
      if (type === 'tv') iconClass = 'fas fa-tv';
      if (type === 'tv2') iconClass = 'fas fa-desktop';
      if (type === 'gov') iconClass = 'fas fa-landmark';
      if (type === 'edu') iconClass = 'fas fa-graduation-cap';

      return `
        <div class="link-card" onclick="window.open('${url}', '_blank')">
          <i class="${iconClass}"></i>
          <div class="card-title">${title}</div>
        </div>
      `;
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const themeIcon = document.getElementById('themeIcon');
      themeIcon.classList.toggle('fa-moon');
      themeIcon.classList.toggle('fa-sun');
    }

    particlesJS('particles-js', {
      particles: {
        number: { value: 90, density: { enable: true, value_area: 800 } },
        color: { value: '#ffffff' },
        shape: { type: 'circle' },
        opacity: { value: 0.4, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 110, color: '#ffffff', opacity: 0.3, width: 1 },
        move: { enable: true, speed: 1.2 }
      },
      interactivity: { events: { onhover: { enable: true, mode: 'grab' } } },
      retina_detect: true
    });
  </script>
</body>
</html>
