<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESER-ALL Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-hover: rgba(255, 255, 255, 0.2);
      --modal-bg: #1e293b;
      --modal-border: #334155;
      --input-bg: #0f172a;
      --input-border: #475569;
      --footer-bg: rgba(15, 23, 42, 0.6);
      --icon-color: #38bdf8;
      --bg-overlay: rgba(15, 23, 42, 0.75);
    }

    [data-theme="light"] {
      --bg-color: #e0f2fe;
      --text-color: #0c4a6e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(56, 189, 248, 0.3);
      --card-hover: #ffffff;
      --modal-bg: #ffffff;
      --modal-border: #bae6fd;
      --input-bg: #f0f9ff;
      --input-border: #7dd3fc;
      --footer-bg: rgba(224, 242, 254, 0.85);
      --icon-color: #0284c7;
      --bg-overlay: rgba(224, 242, 254, 0.45);
    }

    [data-theme="light"] body {
      animation: skyColorShift 18s infinite alternate ease-in-out;
    }

    @keyframes skyColorShift {
      0% { background-color: #e0f2fe; }
      33% { background-color: #bae6fd; }
      66% { background-color: #e0f7fa; }
      100% { background-color: #f0f9ff; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: 'Segoe UI', sans-serif; }
    
    body {
      margin: 0; padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column; justify-content: space-between;
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
    }

    .bg-video-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0;
    }

    .bg-video-container video {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.85) contrast(1.05);
    }

    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-overlay); transition: background 0.5s ease;
    }
    
    .theme-toggle-btn {
      position: fixed; top: 20px; right: 20px; z-index: 1001;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-color); padding: 10px 16px; border-radius: 50px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      font-weight: bold; backdrop-filter: blur(8px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); transition: all 0.3s ease;
    }
    .theme-toggle-btn:hover { background: var(--card-hover); transform: scale(1.03); }

    .dashboard { position: relative; z-index: 1; padding: 30px 15px 10px; text-align: center; }
    .main-header { font-size: 32px; font-weight: 800; margin-bottom: 25px; margin-top: 10px; letter-spacing: 0.5px; }
    .section-title { font-size: 22px; margin: 25px 0 15px; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--text-color); }
    .section-title i { color: var(--icon-color); }

    .link-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; max-width: 950px; margin: 0 auto; }
    .inline-grid { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 950px; margin: 0 auto 20px auto; }
    
    .compact-card { padding: 10px 14px; min-height: auto; flex: 1 1 120px; max-width: 200px; }
    .compact-card i.main-icon { font-size: 28px !important; margin-bottom: 5px; }
    .compact-card div { font-size: 13px; font-weight: 600; }
    
    .link-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; color: var(--text-color); backdrop-filter: blur(10px);
      font-size: 15px; font-weight: 600; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      position: relative; min-height: 100px; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link-card i.main-icon { font-size: 32px; margin-bottom: 8px; color: var(--icon-color); transition: transform 0.2s ease; }
    .link-card:hover { transform: translateY(-4px); background: var(--card-hover); box-shadow: 0 12px 20px rgba(2, 132, 199, 0.2); }
    .link-card:hover i.main-icon { transform: scale(1.1); }

    .status-badge {
      position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 6px; border-radius: 10px;
      font-weight: bold; display: flex; align-items: center; gap: 4px;
    }
    .status-badge.online { background: rgba(76, 175, 80, 0.2); color: #4CAF50; border: 1px solid #4CAF50; }
    .status-badge.offline { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }
    .status-badge.checking { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }

    .user-login-modal { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; 
      align-items: center; z-index: 999; 
    }
    .modal-content { 
      background: var(--modal-bg); color: var(--text-color); padding: 28px; 
      border-radius: 16px; width: 330px; border: 1px solid var(--modal-border); 
      text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
    }
    .modal-content input { 
      width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--input-border); 
      background: var(--input-bg); color: var(--text-color); border-radius: 8px; outline: none; 
    }
    .modal-content button { 
      padding: 12px; margin-top: 5px; cursor: pointer; border: none; 
      border-radius: 8px; font-weight: bold; background: #0284c7; color: white; width: 100%; 
    }

    .logout-btn { 
      position: fixed; left: 20px; bottom: 20px; padding: 10px 18px; border-radius: 20px; 
      border: none; background: #e11d48; color: white; font-size: 14px; font-weight: bold; 
      cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3); 
    }
    
    .developer-footer { 
      position: relative; z-index: 1; text-align: center; padding: 15px 10px; 
      font-size: 14px; background: var(--footer-bg); margin-top: 30px; backdrop-filter: blur(8px); 
    }
    .developer-footer span { font-weight: bold; color: var(--icon-color); }
  </style>
</head>
