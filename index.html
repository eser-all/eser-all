<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESER-ALL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* CSS Variables for Themes */
    :root {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-hover: rgba(255, 255, 255, 0.18);
      --modal-bg: #1e1e1e;
      --modal-border: #333;
      --input-bg: #2a2a2a;
      --input-border: #444;
      --footer-bg: rgba(0, 0, 0, 0.4);
      --icon-color: #00e676;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f9;
      --text-color: #1a1a1a;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.1);
      --card-hover: #eef2f5;
      --modal-bg: #ffffff;
      --modal-border: #ddd;
      --input-bg: #f0f0f0;
      --input-border: #ccc;
      --footer-bg: rgba(0, 0, 0, 0.05);
      --icon-color: #2e7d32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: 'Segoe UI', sans-serif; }
    body {
      margin: 0; padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s ease, color 0.3s ease;
    }

    #particles-js { position: fixed; width: 100%; height: 100%; z-index: 0; }
    
    /* Theme Switcher Button */
    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--card-hover);
    }

    .dashboard { position: relative; z-index: 1; padding: 30px 15px 10px; text-align: center; }
    .main-header { font-size: 32px; font-weight: bold; margin-bottom: 25px; margin-top: 10px; }
    .section-title { font-size: 22px; margin: 25px 0 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .link-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; max-width: 950px; margin: 0 auto; }
    .inline-grid { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; max-width: 950px; margin: 0 auto 20px auto; }
    
    .compact-card { padding: 10px 14px; min-height: auto; flex: 1 1 120px; max-width: 200px; }
    .compact-card i { font-size: 28px !important; margin-bottom: 5px; }
    .compact-card div { font-size: 13px; font-weight: 600; }
    
    .link-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; 
      background: var(--card-bg); 
      border: 1px solid var(--card-border);
      border-radius: 12px; 
      color: var(--text-color); 
      backdrop-filter: blur(6px); 
      font-size: 15px;
      box-shadow: 0 8px 10px rgba(0, 0, 0, 0.15); 
      position: relative; 
      min-height: 100px; 
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .link-card i { font-size: 32px; margin-bottom: 8px; color: var(--text-color); }
    .link-card:hover { transform: translateY(-3px); background: var(--card-hover); }

    .user-login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: var(--modal-bg); color: var(--text-color); padding: 20px; border-radius: 10px; width: 320px; border: 1px solid var(--modal-border); text-align: center; }
    .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 4px; }
    .modal-content button { padding: 10px 16px; margin-top: 5px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background: #4CAF50; color: white; width: 100%; }
    
    .logout-btn { position: fixed; left: 20px; bottom: 20px; padding: 10px 16px; border-radius: 20px; border: none; background: #e91e63; color: white; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 1000; }
    
    .developer-footer { position: relative; z-index: 1; text-align: center; padding: 15px 10px; font-size: 14px; background: var(--footer-bg); margin-top: 30px; }
    .developer-footer span { font-weight: bold; color: var(--icon-color); }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <!-- Mode Switcher Button -->
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeText">Dark</span>
  </button>

  <!-- User Access Modal -->
  <div class="user-login-modal" id="userLoginModal">
    <div class="modal-content" id="loginBox">
      <h3 style="margin-bottom: 15px;"><i class="fas fa-lock"></i> User Access Login</h3>
      <input type="email" id="userInputEmail" placeholder="Email Address">
      <input type="password" id="userInputPass" placeholder="Password">
      <button onclick="checkUserLogin()">Login</button>
    </div>
  </div>

  <div class="dashboard" id="mainDashboard" style="display: none;">
    <div class="main-header">ESER-ALL Portal</div>

    <div class="section-title"><i class="fas fa-server"></i> FTP Servers</div>
    <div class="inline-grid" id="ftp-all-section"></div>

    <div class="section-title"><i class="fas fa-tv"></i> Live TV</div>
    <div class="inline-grid" id="tv-all-section"></div>

    <div class="section-title"><i class="fas fa-landmark"></i> Government Services</div>
    <div class="link-grid" id="gov-section"></div>

    <div class="section-title"><i class="fas fa-graduation-cap"></i> Education & Admissions</div>
    <div class="link-grid" id="edu-section"></div>
  </div>

  <button class="logout-btn" id="btnLogout" style="display: none;" onclick="userLogout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

  <footer class="developer-footer">
    Developed by <span>Antu</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // Theme Management Script
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'light') {
        icon.className = 'fas fa-sun';
        text.innerText = 'Light';
      } else {
        icon.className = 'fas fa-moon';
        text.innerText = 'Dark';
      }
    }

    initTheme();

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDB4r_a5gPtKhlzM0qqmYHBb6HA_I2SmHQ",
      authDomain: "eser-all.firebaseapp.com",
      databaseURL: "https://eser-all-default-rtdb.firebaseio.com",
      projectId: "eser-all",
      storageBucket: "eser-all.firebasestorage.app",
      messagingSenderId: "741870576674",
      appId: "1:741870576674:web:2a5094bd05f44f0b98d67b",
      measurementId: "G-CQLKEKLC6K"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const FTP_API_HOST = '10.10.10.10';
    const FTP2_API_HOST = '172.16.50.4'; 
    const FTP3_API_HOST = '172.19.178.179';
    const FTP4_API_HOST = '10.16.100.244';
    const TV_API_HOST = '172.28.28.54';
    const TV2_API_HOST = '172.19.178.180';

    function checkUserLogin() {
      const email = document.getElementById('userInputEmail').value.trim();
      const pass = document.getElementById('userInputPass').value.trim();

      if (!email || !pass) {
        alert('Please enter both Email and Password!');
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then((userCredential) => {
          showDashboard();
        })
        .catch((error) => {
          alert('Login Failed: ' + error.message);
        });
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        showDashboard();
      } else {
        document.getElementById('userLoginModal').style.display = 'flex';
        document.getElementById('mainDashboard').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
      }
    });

    function showDashboard() {
      document.getElementById('userLoginModal').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'block';
      document.getElementById('btnLogout').style.display = 'block';
      renderLinks();
    }

    function userLogout() {
      auth.signOut().then(() => {
        location.reload();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof particlesJS !== 'undefined') {
        particlesJS('particles-js', {
          particles: {
            number: { value: 50 },
            color: { value: '#888888' },
            shape: { type: 'circle' },
            opacity: { value: 0.3 },
            size: { value: 3 },
            move: { enable: true, speed: 2 }
          }
        });
      }
    });

    let ftpLinks = [{ title: "FTP Server 1", url: `http://${FTP_API_HOST}/` }];
    let ftp2Links = [{ title: "FTP Server 2", url: `http://${FTP2_API_HOST}/` }];
    let ftp3Links = [{ title: "FTP Server 3", url: `http://${FTP3_API_HOST}/` }];
    let ftp4Links = [{ title: "FTP Server 4", url: `http://${FTP4_API_HOST}/` }];
    
    let tvLinks = [{ title: "Live TV 1", url: `http://${TV_API_HOST}/` }];
    let tv2Links = [{ title: "Live TV 2", url: `http://${TV2_API_HOST}/` }];
    let tv3Links = [{ title: "Live TV 3", url: "https://toffeelive.com" }];
    let tv4Links = [{ title: "Live TV 4", url: "https://www.jagobd.com/" }];

    let govLinks = [
      { title: "NID / ভোটার আবেদন", url: "http://services.nidw.gov.bd" },
      { title: "জন্ম নিবন্ধন ও সংশোধন", url: "http://bdris.gov.bd" },
      { title: "পাসপোর্টের আবেদন", url: "http://epassport.gov.bd" }
    ];

    let eduLinks = [
      { title: "ঢাকা বিশ্ববিদ্যালয়", url: "http://duadmission.eis.du.ac.bd" },
      { title: "জাতীয় বিশ্ববিদ্যালয় রেজাল্ট", url: "http://results.nu.ac.bd/" }
    ];

    function renderLinks() {
      const ftpAllContainer = document.getElementById('ftp-all-section');
      const tvAllContainer = document.getElementById('tv-all-section');
      const govc = document.getElementById('gov-section');
      const educ = document.getElementById('edu-section');
      
      ftpAllContainer.innerHTML = ''; 
      tvAllContainer.innerHTML = ''; 
      govc.innerHTML = ''; 
      educ.innerHTML = '';
      
      ftpLinks.concat(ftp2Links, ftp3Links, ftp4Links).forEach((l) => { 
        ftpAllContainer.innerHTML += genCard(l.title, l.url, 'ftp', true); 
      });

      tvLinks.concat(tv2Links, tv3Links, tv4Links).forEach((l) => { 
        tvAllContainer.innerHTML += genCard(l.title, l.url, 'tv', true); 
      });

      govLinks.forEach((l) => { 
        govc.innerHTML += genCard(l.title, l.url, 'gov', false); 
      });

      eduLinks.forEach((l) => { 
        educ.innerHTML += genCard(l.title, l.url, 'edu', false); 
      });
    }

    function genCard(title, url, type, isCompact = false) {
      let iconClass = 'fas fa-globe';
      if (type === 'ftp') iconClass = 'fas fa-server';
      if (type === 'tv') iconClass = 'fas fa-tv';
      if (type === 'gov') iconClass = 'fas fa-landmark';
      if (type === 'edu') iconClass = 'fas fa-graduation-cap';
      
      const compactClass = isCompact ? 'compact-card' : '';

      return `
        <div class="link-card ${compactClass}" onclick="window.open('${url}', '_blank')">
          <i class="${iconClass}"></i>
          <div>${title}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
