<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESER-ALL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      margin: 0; padding: 0;
      background: #121212;
      color: #f0f0f0;
      transition: background 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    body.light-mode {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .dashboard {
      position: relative;
      z-index: 1;
      padding: 30px 15px 10px;
      text-align: center;
    }
    .main-header {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .section-title {
      font-size: 22px;
      margin: 25px 0 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 950px;
      margin: 0 auto;
    }
    .inline-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 950px;
      margin: 0 auto 20px auto;
    }
    .compact-card {
      padding: 10px 14px;
      min-height: auto;
      flex: 1 1 120px;
      max-width: 200px;
    }
    .compact-card i {
      font-size: 28px !important;
    }
    .compact-card div {
      font-size: 13px;
      font-weight: 600;
    }
    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      backdrop-filter: blur(6px);
      font-size: 15px;
      box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
      position: relative;
      min-height: 100px;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .link-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.18);
    }
    .link-card i.fa-play-circle { color: #4CAF50; font-size: 50px; pointer-events: none; }
    .link-card i.fa-folder-open { color: #FFC107; font-size: 50px; pointer-events: none; }
    .link-card i.fa-film { color: #E91E63; font-size: 50px; pointer-events: none; }
    .link-card i.fa-photo-video { color: #9C27B0; font-size: 50px; pointer-events: none; }
    .link-card i.fa-tv { color: #FF9800; font-size: 50px; pointer-events: none; }
    .link-card i.fa-desktop { color: #00BCD4; font-size: 50px; pointer-events: none; }
    .link-card i.fa-satellite-dish { color: #E040FB; font-size: 50px; pointer-events: none; }
    .link-card i.fa-globe { color: #FF5252; font-size: 50px; pointer-events: none; }
    .link-card i.fa-landmark { color: #00E676; font-size: 50px; pointer-events: none; }
    .link-card i.fa-graduation-cap { color: #FF5722; font-size: 50px; pointer-events: none; }
    .link-card a {
      color: white;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      height: 100%;
    }
    .edit-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
    .modal, .login-modal, .user-login-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: #1e1e1e;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      border: 1px solid #333;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      border-radius: 4px;
    }
    .modal-content button {
      padding: 8px 16px;
      margin-top: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .modal-content button.btn-primary { background: #4CAF50; color: white; width: 100%; }
    .auth-toggle-link {
      margin-top: 15px;
      font-size: 13px;
      color: #00e676;
      cursor: pointer;
      text-decoration: underline;
    }
    #btnCancelLogin { background: #444; color: #fff; }
    .theme-toggle {
      position: fixed;
      left: 20px; bottom: 20px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid white;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
    }
    .logout-btn {
      position: fixed;
      right: 20px; bottom: 20px;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: #e91e63;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
    }
    .developer-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 15px 10px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      margin-top: 30px;
    }
    .developer-footer span { font-weight: bold; color: #00e676; }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  
  <!-- User Access Modal -->
  <div class="user-login-modal" id="userLoginModal">
    <!-- Login Form -->
    <div class="modal-content" id="loginBox">
      <h3 style="margin-bottom: 15px;"><i class="fas fa-lock"></i> User Access Login</h3>
      <input type="text" id="userInputId" placeholder="User ID or Email">
      <input type="password" id="userInputPass" placeholder="Password">
      <button class="btn-primary" onclick="checkUserLogin()">Login</button>
      <div class="auth-toggle-link" onclick="toggleAuthMode('signup')">Don't have an ID? Create One</div>
    </div>

    <!-- Sign Up Form (With Email Field) -->
    <div class="modal-content" id="signupBox" style="display: none;">
      <h3 style="margin-bottom: 15px;"><i class="fas fa-user-plus"></i> Create New User</h3>
      <input type="text" id="newUserId" placeholder="Choose User ID">
      <input type="email" id="newUserEmail" placeholder="Enter Email ID">
      <input type="password" id="newUserPass" placeholder="Choose Password">
      <button class="btn-primary" style="background: #2196F3;" onclick="createNewUser()">Create Account</button>
      <div class="auth-toggle-link" onclick="toggleAuthMode('login')">Already have an ID? Login</div>
    </div>
  </div>

  <div class="dashboard" id="mainDashboard" style="display: none;">
    <div class="main-header">ESER-ALL Portal</div>

    <!-- FTP Servers Section -->
    <div class="section-title"><i class="fas fa-server"></i> FTP Servers</div>
    <div class="inline-grid" id="ftp-all-section"></div>

    <!-- Live TV Section -->
    <div class="section-title"><i class="fas fa-tv"></i> Live TV</div>
    <div class="inline-grid" id="tv-all-section"></div>

    <!-- Government Services -->
    <div class="section-title"><i class="fas fa-landmark"></i> Government Services (সরকারি সেবা)</div>
    <div class="link-grid" id="gov-section"></div>

    <!-- Education & Admissions -->
    <div class="section-title"><i class="fas fa-graduation-cap"></i> University Admissions & Board Results (শিক্ষা ও ভর্তি সেবা)</div>
    <div class="link-grid" id="edu-section"></div>
    
    <div class="dashboard-controls" id="adminControls" style="display: none; margin-top: 20px;">
      <button id="btnToggleEdit" onclick="toggleEditIcons()" style="padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; background: #fff; color: #000;">Show Edit</button>
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <div class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i>
  </div>

  <!-- Logout Button -->
  <button class="logout-btn" id="btnLogout" style="display: none;" onclick="userLogout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

  <footer class="developer-footer">
    Developed by <span>Antu</span>
  </footer>

  <!-- Edit Modal -->
  <div class="modal" id="editModal" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Edit Link</h3>
      <input type="text" id="editTitle" placeholder="Name">
      <input type="text" id="editURL" placeholder="URL">
      <button onclick="saveEdit()" style="background: #4CAF50; color: white;">Save</button>
      <button onclick="closeModal()" id="btnCancelEdit" style="background: #555; color: #fff;">Cancel</button>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div class="login-modal" id="loginModal" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Admin Login</h3>
      <input type="password" id="adminPass" placeholder="Enter Admin Password">
      <button onclick="checkLogin()" style="background: #4CAF50; color: white;">Login</button>
      <button id="btnCancelLogin">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    const FTP_API_HOST = '10.10.10.10';
    const FTP2_API_HOST = '172.16.50.4'; 
    const FTP3_API_HOST = '172.19.178.179';
    const FTP4_API_HOST = '10.16.100.244';
    const TV_API_HOST = '172.28.28.54';
    const TV2_API_HOST = '172.19.178.180';

    // ডিফল্ট ইউজার তালিকা (Email সহ)
    const defaultUsers = [
      { id: "user1", email: "user1@gmail.com", pass: "1234" },
      { id: "antu", email: "antu@gmail.com", pass: "antu2026" }
    ];

    // LocalStorage থেকে ডাটা নেওয়া
    function getUsers() {
      const stored = localStorage.getItem('eser_app_users');
      if (stored) {
        return JSON.parse(stored);
      } else {
        localStorage.setItem('eser_app_users', JSON.stringify(defaultUsers));
        return defaultUsers;
      }
    }

    // Toggle Sign Up and Login Forms
    function toggleAuthMode(mode) {
      if (mode === 'signup') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('signupBox').style.display = 'block';
      } else {
        document.getElementById('signupBox').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
      }
    }

    // Email validation helper
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // New User Registration with Email
    function createNewUser() {
      const newId = document.getElementById('newUserId').value.trim();
      const newEmail = document.getElementById('newUserEmail').value.trim();
      const newPass = document.getElementById('newUserPass').value.trim();

      if (!newId || !newEmail || !newPass) {
        alert('Please fill in User ID, Email, and Password!');
        return;
      }

      if (!validateEmail(newEmail)) {
        alert('Please enter a valid Email address!');
        return;
      }

      const users = getUsers();
      
      // Check User ID duplicate
      const idExists = users.some(u => u.id.toLowerCase() === newId.toLowerCase());
      if (idExists) {
        alert('This User ID is already taken!');
        return;
      }

      // Check Email duplicate
      const emailExists = users.some(u => u.email && u.email.toLowerCase() === newEmail.toLowerCase());
      if (emailExists) {
        alert('This Email ID is already registered!');
        return;
      }

      users.push({ id: newId, email: newEmail, pass: newPass });
      localStorage.setItem('eser_app_users', JSON.stringify(users));

      alert('Account created successfully! You can now login.');
      document.getElementById('newUserId').value = '';
      document.getElementById('newUserEmail').value = '';
      document.getElementById('newUserPass').value = '';
      toggleAuthMode('login');
    }

    let ftpLinks = [{ title: "FTP Server 1", url: `http://${FTP_API_HOST}/` }];
    let ftp2Links = [{ title: "FTP Server 2", url: `http://${FTP2_API_HOST}/` }];
    let ftp3Links = [{ title: "FTP Server 3", url: `http://${FTP3_API_HOST}/` }];
    let ftp4Links = [{ title: "FTP Server 4", url: `http://${FTP4_API_HOST}/dashboard.php?session=c2c3e6c0aa01b1c155cec1fbab1bc6c47883390af1b4cb470ee461ff53665061` }];
    
    let tvLinks = [{ title: "Live TV 1", url: `http://${TV_API_HOST}/` }];
    let tv2Links = [{ title: "Live TV 2", url: `http://${TV2_API_HOST}/` }];
    let tv3Links = [{ title: "Live TV 3", url: "https://toffeelive.com/en/watch/qnv835oBcqxnFHJBuQcB" }];
    let tv4Links = [{ title: "Live TV 4", url: "https://www.jagobd.com/" }];

    let govLinks = [
      { title: "NID / ভোটার আবেদন", url: "http://services.nidw.gov.bd" },
      { title: "জন্ম নিবন্ধন ও সংশোধন", url: "http://bdris.gov.bd" },
      { title: "পাসপোর্টের আবেদন", url: "http://epassport.gov.bd" },
      { title: "পুলিশ ক্লিয়ারেন্স আবেদন", url: "http://pcc.police.gov.bd" },
      { title: "টিন (e-TIN) সার্টিফিকেট", url: "http://incometax.gov.bd" }
    ];

    let eduLinks = [
      { title: "জিএসটি/গুচ্ছ বিশ্ববিদ্যালয়", url: "http://gstadmission.ac.bd" },
      { title: "ঢাকা বিশ্ববিদ্যালয়", url: "http://duadmission.eis.du.ac.bd" },
      { title: "জাতীয় বিশ্ববিদ্যালয় ভর্তি", url: "http://app11.nu.edu.bd/" },
      { title: "জাতীয় বিশ্ববিদ্যালয় রেজাল্ট", url: "http://results.nu.ac.bd/" },
      { title: "জেএসসি/জেডিসি/এসএসসি/দাখিল/এইচএসসি/আলিম ও সমমানের পরীক্ষা", url: "https://www.educationboardresults.gov.bd/v2/home" }
    ];

    let currentEdit = { type: '', index: -1 };
    let isAdmin = false, showEditIcons = false;

    // Login Check (Allows login via ID or Email)
    function checkUserLogin() {
      const input = document.getElementById('userInputId').value.trim();
      const upass = document.getElementById('userInputPass').value.trim();

      const users = getUsers();
      const foundUser = users.find(u => 
        (u.id.toLowerCase() === input.toLowerCase() || (u.email && u.email.toLowerCase() === input.toLowerCase())) && 
        u.pass === upass
      );

      if (foundUser) {
        sessionStorage.setItem('isUserLoggedIn', 'true');
        sessionStorage.setItem('loggedInUser', foundUser.id);
        showDashboard();
      } else {
        alert('Invalid User ID/Email or Password!');
      }
    }

    function showDashboard() {
      document.getElementById('userLoginModal').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'block';
      document.getElementById('btnLogout').style.display = 'block';
      fetchLinks();
    }

    function userLogout() {
      sessionStorage.removeItem('isUserLoggedIn');
      sessionStorage.removeItem('loggedInUser');
      location.reload();
    }

    function renderLinks() {
      const ftpAllContainer = document.getElementById('ftp-all-section');
      const tvAllContainer = document.getElementById('tv-all-section');
      const govc = document.getElementById('gov-section');
      const educ = document.getElementById('edu-section');
      
      ftpAllContainer.innerHTML = '';
      tvAllContainer.innerHTML = '';
      govc.innerHTML = '';
      educ.innerHTML = '';
      
      ftpLinks.forEach((l, i) => { ftpAllContainer.innerHTML += genCard(l.title, l.url, 'ftp', i, true); });
      ftp2Links.forEach((l, i) => { ftpAllContainer.innerHTML += genCard(l.title, l.url, 'ftp2', i, true); });
      ftp3Links.forEach((l, i) => { ftpAllContainer.innerHTML += genCard(l.title, l.url, 'ftp3', i, true); });
      ftp4Links.forEach((l, i) => { ftpAllContainer.innerHTML += genCard(l.title, l.url, 'ftp4', i, true); });

      tvLinks.forEach((l, i) => { tvAllContainer.innerHTML += genCard(l.title, l.url, 'tv', i, true); });
      tv2Links.forEach((l, i) => { tvAllContainer.innerHTML += genCard(l.title, l.url, 'tv2', i, true); });
      tv3Links.forEach((l, i) => { tvAllContainer.innerHTML += genCard(l.title, l.url, 'tv3', i, true); });
      tv4Links.forEach((l, i) => { tvAllContainer.innerHTML += genCard(l.title, l.url, 'tv4', i, true); });

      govLinks.forEach((l, i) => { govc.innerHTML += genCard(l.title, l.url, 'gov', i, false); });
      eduLinks.forEach((l, i) => { educ.innerHTML += genCard(l.title, l.url, 'edu', i, false); });
    }

    function genCard(title, url, type, idx, isCompact = false) {
      let formattedUrl = url || '';
      if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) {
        formattedUrl = `http://${formattedUrl}`;
      }

      let iconClass = 'fas fa-play-circle';
      if (type === 'ftp2') iconClass = 'fas fa-folder-open';
      if (type === 'ftp3') iconClass = 'fas fa-film';
      if (type === 'ftp4') iconClass = 'fas fa-photo-video';
      if (type === 'tv') iconClass = 'fas fa-tv';
      if (type === 'tv2') iconClass = 'fas fa-desktop';
      if (type === 'tv3') iconClass = 'fas fa-satellite-dish';
      if (type === 'tv4') iconClass = 'fas fa-globe';
      if (type === 'gov') iconClass = 'fas fa-landmark';
      if (type === 'edu') iconClass = 'fas fa-graduation-cap';

      const compactClass = isCompact ? 'compact-card' : '';

      return `
        <div class="link-card ${compactClass}" onclick="openTargetUrl(event, '${formattedUrl}')">
          <a href="${formattedUrl}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault();">
            <i class="${iconClass}"></i>
            <div>${title}</div>
          </a>
          ${isAdmin && showEditIcons ? `<div class="edit-btn" onclick="openModal(event, '${type}', ${idx})">Edit</div>` : ''}
        </div>
      `;
    }

    function openTargetUrl(event, url) {
      if (event.target.classList.contains('edit-btn')) return;
      window.open(url, '_blank');
    }

    async function tryFetchAPI(url, callback) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          callback(data);
        }
      } catch (err) {}
    }

    async function fetchLinks() {
      renderLinks();

      await tryFetchAPI(`http://${FTP_API_HOST}/api/links`, data => { if(data.ftp) ftpLinks = data.ftp; });
      await tryFetchAPI(`http://${FTP2_API_HOST}/api/links`, data => { if(data.ftp2) ftp2Links = data.ftp2; });
      await tryFetchAPI(`http://${FTP3_API_HOST}/api/links`, data => { if(data.ftp3) ftp3Links = data.ftp3; });
      await tryFetchAPI(`http://${FTP4_API_HOST}/api/links`, data => { if(data.ftp4) ftp4Links = data.ftp4; });
      await tryFetchAPI(`http://${TV_API_HOST}/api/links`, data => { if(data.tv) tvLinks = data.tv; });
      await tryFetchAPI(`http://${TV2_API_HOST}/api/links`, data => { if(data.tv2) tv2Links = data.tv2; });

      renderLinks();
    }

    function openModal(event, type, index) {
      event.stopPropagation();
      currentEdit = { type, index };
      let data;
      if (type === 'ftp') data = ftpLinks[index];
      else if (type === 'ftp2') data = ftp2Links[index];
      else if (type === 'ftp3') data = ftp3Links[index];
      else if (type === 'ftp4') data = ftp4Links[index];
      else if (type === 'tv') data = tvLinks[index];
      else if (type === 'tv2') data = tv2Links[index];
      else if (type === 'tv3') data = tv3Links[index];
      else if (type === 'tv4') data = tv4Links[index];
      else if (type === 'gov') data = govLinks[index];
      else if (type === 'edu') data = eduLinks[index];

      if (data) {
        document.getElementById('editTitle').value = data.title || '';
        document.getElementById('editURL').value = data.url || '';
        document.getElementById('editModal').style.display = 'flex';
      }
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function saveEdit() {
      const nt = document.getElementById('editTitle').value.trim();
      const nu = document.getElementById('editURL').value.trim();
      if (!nt || !nu) return alert('Fill all fields!');

      let targetHost = FTP_API_HOST;
      if (currentEdit.type === 'ftp') ftpLinks[currentEdit.index] = { title: nt, url: nu };
      else if (currentEdit.type === 'ftp2') { ftp2Links[currentEdit.index] = { title: nt, url: nu }; targetHost = FTP2_API_HOST; }
      else if (currentEdit.type === 'ftp3') { ftp3Links[currentEdit.index] = { title: nt, url: nu }; targetHost = FTP3_API_HOST; }
      else if (currentEdit.type === 'ftp4') { ftp4Links[currentEdit.index] = { title: nt, url: nu }; targetHost = FTP4_API_HOST; }
      else if (currentEdit.type === 'tv') { tvLinks[currentEdit.index] = { title: nt, url: nu }; targetHost = TV_API_HOST; }
      else if (currentEdit.type === 'tv2') { tv2Links[currentEdit.index] = { title: nt, url: nu }; targetHost = TV2_API_HOST; }
      else if (currentEdit.type === 'tv3') { tv3Links[currentEdit.index] = { title: nt, url: nu }; }
      else if (currentEdit.type === 'tv4') { tv4Links[currentEdit.index] = { title: nt, url: nu }; }
      else if (currentEdit.type === 'gov') { govLinks[currentEdit.index] = { title: nt, url: nu }; }
      else if (currentEdit.type === 'edu') { eduLinks[currentEdit.index] = { title: nt, url: nu }; }

      try {
        await fetch(`http://${targetHost}/api/links`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ftp: ftpLinks, ftp2: ftp2Links, ftp3: ftp3Links, ftp4: ftp4Links, tv: tvLinks, tv2: tv2Links, tv3: tv3Links, tv4: tv4Links, gov: govLinks, edu: eduLinks })
        });
      } catch (err) {}
      
      closeModal();
      renderLinks();
    }

    function checkLogin() {
      if (document.getElementById('adminPass').value === 'admin123') {
        isAdmin = true;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('adminControls').style.display = 'block';
        document.getElementById('adminPass').value = '';
        renderLinks();
      } else { alert('Wrong password!'); }
    }

    function toggleEditIcons() {
      showEditIcons = !showEditIcons;
      document.getElementById('btnToggleEdit').textContent = showEditIcons ? 'Hide Edit' : 'Show Edit';
      renderLinks();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const themeIcon = document.getElementById('themeIcon');
      themeIcon.classList.toggle('fa-moon');
      themeIcon.classList.toggle('fa-sun');
    }

    document.addEventListener('keydown', e => {
      if (e.shiftKey && e.key.toLowerCase() === 'a') {
        document.getElementById('loginModal').style.display = 'flex';
      }
    });

    document.getElementById('btnCancelLogin').addEventListener('click', () => {
      document.getElementById('loginModal').style.display = 'none';
    });

    window.onload = function() {
      getUsers();
      if (sessionStorage.getItem('isUserLoggedIn') === 'true') {
        showDashboard();
      } else {
        document.getElementById('userLoginModal').style.display = 'flex';
      }
    };

    particlesJS('particles-js', {
      particles: {
        number: { value: 100, density: { enable: true, value_area: 800 } },
        color: { value: '#ffffff' },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 100, color: '#ffffff', opacity: 0.4, width: 1.2 },
        move: { enable: true, speed: 1.5 }
      },
      interactivity: { events: { onhover: { enable: true, mode: 'grab' } } },
      retina_detect: true
    });
  </script>
</body>
</html>
